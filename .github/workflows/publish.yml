name: Verify and publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm install --global npm@12.2.3 --ignore-scripts
      - name: Verify release tag and main ancestry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e 'const p=require("./package.json"); if(process.env.GITHUB_REF_NAME!=="v"+p.version) throw new Error("Tag and package version differ")'
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:package
      - name: Run native n8n release admission without publishing
        run: npm run release
        env:
          NPM_CONFIG_DRY_RUN: 'true'
      - name: Pack the checked distribution
        id: artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p "$RUNNER_TEMP/npm-artifacts"
          npm pack --json --pack-destination "$RUNNER_TEMP/npm-artifacts" > "$RUNNER_TEMP/npm-pack.json"
          node -e 'const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto");const [pack]=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,"npm-pack.json"),"utf8"));const dir=path.join(process.env.RUNNER_TEMP,"npm-artifacts");const from=path.join(dir,pack.filename),to=path.join(dir,"package.tgz");fs.renameSync(from,to);fs.appendFileSync(process.env.GITHUB_OUTPUT,"sha256="+crypto.createHash("sha256").update(fs.readFileSync(to)).digest("hex")+"\n");'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: checked-npm-package
          path: ${{ runner.temp }}/npm-artifacts/package.tgz
          if-no-files-found: error

  publish:
    if: github.repository == 'sarj-ai/n8n-nodes-sarj' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sarj-ai/n8n-nodes-sarj
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm install --global npm@12.2.3 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-npm-package
          path: ${{ runner.temp }}/npm-artifacts
      - name: Verify the exact tested artifact
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: |
          node -e 'const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto");const file=path.join(process.env.RUNNER_TEMP,"npm-artifacts/package.tgz");const actual=crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");if(!/^[a-f0-9]{64}$/.test(process.env.EXPECTED_SHA256)||actual!==process.env.EXPECTED_SHA256)throw new Error("Artifact digest mismatch");'
      - name: Publish checked archive with provenance and revoke bootstrap access
        run: bash scripts/ci-publish.sh "$RUNNER_TEMP/npm-artifacts/package.tgz"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

# Delete the revoked NPM_TOKEN environment secret after the bootstrap run.
# Configure package-only Trusted Publishing when the next real release is ready:
# sarj-ai/n8n-nodes-sarj, publish.yml, environment npm. npm expires unused new
# publisher grants after two days, so do not create a dormant grant now.
# The bootstrap token is revoked with npm logout even when publication fails.
# A cancelled runner still requires owner revocation; its short expiry is a fallback.
