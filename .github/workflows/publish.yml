name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/@sarj-ai/n8n-nodes-sarj
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.3'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm
      - name: Use an npm version supporting Trusted Publishing
        run: npm install --global npm@12.2.3
      - name: Verify tag version
        run: |
          node -e 'const p=require("./package.json"); const tag=process.env.GITHUB_REF_NAME.replace(/^v/,""); if(tag!==p.version) throw new Error("Tag and package version differ")'
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Publish with the official n8n release command and npm provenance
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

# Preferred: configure npm Trusted Publishing for sarj-ai/n8n-nodes-sarj,
# workflow publish.yml, environment npm. Leave NPM_TOKEN unset.
# Initial publication may require the owner's approved bootstrap authentication.
# Never publish this verified-node candidate from a local workstation.
